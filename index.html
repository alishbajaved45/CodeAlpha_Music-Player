<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

 <!-- HEADER -->
<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTE4hAft_kCJAjyD-JBWOBUslB0qj-pjOe8nbfrgTCWdw&s=10.png" alt="Melody logo" class="logo-img">
    </span>
    <div>
        <h1>Melody</h1>
        <p class="tagline">Where the beat lives</p>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="layout">

    <!-- PLAYLIST PANEL -->
    <section class="panel playlist-panel" aria-label="Playlist">
      <div class="panel-heading">
        <h2>Playlist</h2>
        <span class="song-count" id="songCount">5 songs</span>
      </div>

      <ul class="playlist" id="playlist" role="listbox" aria-label="Song list">
        <!-- Playlist items injected by JS -->
      </ul>

      <div class="autoplay-row">
        <div class="autoplay-label">
          <span class="eyebrow">Autoplay</span>
          <span class="autoplay-hint">Play the next song automatically</span>
        </div>
        <button class="toggle" id="autoplayToggle" role="switch" aria-checked="true" aria-label="Toggle autoplay">
          <span class="toggle-knob"></span>
        </button>
      </div>
    </section>

    <!-- MAIN PLAYER -->
    <section class="panel player-panel" aria-label="Now playing">

      <div class="cover-wrap">
        <img class="cover-art" id="coverArt" src="" alt="" width="320" height="320">
        <div class="cover-glow" id="coverGlow" aria-hidden="true"></div>
        <div class="cover-fallback" id="coverFallback" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </div>
      </div>

      <div class="track-info">
        <h2 class="track-title" id="trackTitle">—</h2>
        <p class="track-artist" id="trackArtist">—</p>
      </div>

      <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>

      <div class="progress-section">
        <span class="time" id="currentTime">0:00</span>
        <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" step="0.1"
               aria-label="Seek song position">
        <span class="time" id="durationTime">0:00</span>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous song">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
        </button>

        <button class="ctrl-btn play-btn" id="playBtn" aria-label="Play">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="ctrl-btn" id="nextBtn" aria-label="Next song">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
        </button>
      </div>

      <div class="volume-section">
        <span class="volume-icon" id="volumeIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        </span>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70"
               aria-label="Volume control">
        <span class="volume-value" id="volumeValue">70%</span>
      </div>

      <audio id="audio" preload="metadata"></audio>
    </section>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
